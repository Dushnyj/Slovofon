name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows release portable
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Prepare Windows portable ZIP
        id: windows_artifact
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $artifactDir = "artifacts/v$version"
          $artifactName = "Slovofon-v$version-windows-x64-portable"
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$artifactDir/$artifactName.zip" `
            -Force
          "name=$artifactName" >> $env:GITHUB_OUTPUT
          "path=$artifactDir/$artifactName.zip" >> $env:GITHUB_OUTPUT

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.windows_artifact.outputs.name }}
          path: ${{ steps.windows_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14
