name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag. Empty means v<VERSION>."
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # Dispatch and tag events must not race to publish the same version.
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.0"
  JAVA_VERSION: "17"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      artifact_dir: ${{ steps.metadata.outputs.artifact_dir }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="$REQUESTED_RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="v${version}"
            fi
          fi
          if [[ "$tag" != v* ]]; then
            echo "::error::Release tag must start with v: $tag"
            exit 1
          fi
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::VERSION is $version but release tag is $tag"
            exit 1
          fi
          pubspec_version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          if [[ "$pubspec_version" != "${version}"+* ]]; then
            echo "::error::pubspec.yaml version ($pubspec_version) does not match VERSION ($version)"
            exit 1
          fi
          app_version="$(grep -E "static const version = '[^']+';" lib/app/app_version.dart | sed -E "s/.*'([^']+)'.*/\\1/")"
          app_build="$(grep -E "static const buildNumber = '[^']+';" lib/app/app_version.dart | sed -E "s/.*'([^']+)'.*/\\1/")"
          pubspec_build="${pubspec_version#*+}"
          if [[ "$app_version" != "$version" || "$app_build" != "$pubspec_build" ]]; then
            echo "::error::AppVersion is ${app_version}+${app_build}, expected ${version}+${pubspec_build}"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "artifact_dir=artifacts/$tag"
            echo "prerelease=${{ inputs.prerelease || false }}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify existing release tag matches the build commit
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          . ./tools/release/ReleaseGuard.ps1
          $commit = git rev-parse "$($env:GITHUB_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Build commit could not be resolved.' }
          Assert-RemoteReleaseTag -Tag $env:RELEASE_TAG -ExpectedCommit $commit | Out-Null

  checks:
    name: Flutter checks
    runs-on: ubuntu-24.04
    needs: metadata
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test Windows portable native policies
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG \
            windows/runner/tests/windows_installation_policy_test.cpp \
            -o "$RUNNER_TEMP/windows-installation-policy-test"
          "$RUNNER_TEMP/windows-installation-policy-test"
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -pthread \
            windows/runner/tests/windows_installation_task_test.cpp \
            -o "$RUNNER_TEMP/windows-installation-task-test"
          "$RUNNER_TEMP/windows-installation-task-test"
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -pthread \
            windows/runner/tests/windows_close_request_test.cpp \
            -o "$RUNNER_TEMP/windows-close-request-test"
          "$RUNNER_TEMP/windows-close-request-test"
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG \
            windows/runner/tests/windows_activation_test.cpp \
            -o "$RUNNER_TEMP/windows-activation-test"
          "$RUNNER_TEMP/windows-activation-test"
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG \
            windows/runner/tests/window_size_policy_test.cpp \
            -o "$RUNNER_TEMP/window-size-policy-test"
          "$RUNNER_TEMP/window-size-policy-test"

  android-release:
    name: Android signed release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - checks
    timeout-minutes: 45
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Android signing files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/slovofon-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          cat > android/key.properties <<EOF
          storeFile=$keystore_path
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android universal APK
        run: flutter build apk --release

      - name: Build Android ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android AAB
        run: flutter build appbundle --release

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Prepare Android release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          out="${{ needs.metadata.outputs.artifact_dir }}"
          mkdir -p "$out"
          cp build/app/outputs/flutter-apk/app-release.apk "$out/Slovofon-v${version}-android-universal-release.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$out/Slovofon-v${version}-android-arm64-v8a-release.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$out/Slovofon-v${version}-android-armeabi-v7a-release.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$out/Slovofon-v${version}-android-x86_64-release.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$out/Slovofon-v${version}-android-release.aab"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: ${{ needs.metadata.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Clean Android signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/slovofon-upload.jks"

  windows-release:
    name: Windows release packages
    runs-on: windows-2022
    needs:
      - metadata
      - checks
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test Windows single-instance native fixture
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC installation not found.' }
          $developerCommand = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $environment = & $env:ComSpec /d /s /c "`"$developerCommand`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed.' }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          # Standalone test HWND/processes use a unique namespace, never the app or its data.
          $out = Join-Path $env:RUNNER_TEMP 'windows-single-instance-test'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Push-Location $out
          try {
            & cl.exe /nologo /std:c++17 /EHsc /utf-8 /W4 /WX /UNDEBUG /DNOMINMAX `
              "$env:GITHUB_WORKSPACE/windows/runner/tests/windows_single_instance_test.cpp" `
              "$env:GITHUB_WORKSPACE/windows/runner/windows_single_instance.cpp" `
              /Fe:windows-single-instance-test.exe /link user32.lib advapi32.lib shell32.lib
            if ($LASTEXITCODE -ne 0) { throw "Native fixture compilation failed ($LASTEXITCODE)." }
            & .\windows-single-instance-test.exe
            if ($LASTEXITCODE -ne 0) { throw "Native fixture failed ($LASTEXITCODE)." }
          } finally {
            Pop-Location
          }

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Verify Windows installer contracts
        run: flutter test test/platform/windows_installer_contract_test.dart test/platform/installer_update_url_test.dart

      - name: Verify app-local Windows runtime dependencies
        shell: pwsh
        run: ./tools/windows/Assert-WindowsRuntime.ps1 -BundleDir build/windows/x64/runner/Release

      - name: Prepare signing certificate
        id: signing
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'slovofon-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            "enabled=true" >> $env:GITHUB_OUTPUT
            "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning 'Windows signing secrets are not configured. Windows artifacts will be unsigned.'
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Sign Windows app executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe not found' }
          $exe = "build\windows\x64\runner\Release\Slovofon.exe"
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "${{ steps.signing.outputs.pfx_path }}" /p "$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install packaging tools
        id: packaging
        shell: pwsh
        run: |
          # The pinned upstream version is not necessarily on Chocolatey.
          # Verify the official immutable asset before executing any code.
          $innoSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.2.exe'
          $innoDir = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.2'
          if (Test-Path -LiteralPath $innoDir) { throw 'Inno compiler directory already exists.' }
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_2/innosetup-6.7.2.exe' -OutFile $innoSetup
          $hash = (Get-FileHash -LiteralPath $innoSetup -Algorithm SHA256).Hash
          if ($hash -ine '9f27f8386e554eb093336a1ca5c2dcacb7dbf04ab020889491d7ac53c38a12ff') {
            throw 'Inno Setup SHA-256 mismatch; refusing to execute the download.'
          }
          if ((Get-Item -LiteralPath $innoSetup).Length -ne 10618616) { throw 'Inno Setup size mismatch.' }
          # Upstream portable mode avoids registration, file associations and IDE launch.
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/CURRENTUSER', '/PORTABLE=1', '/TASKS=""', "/DIR=`"$innoDir`"")
          $process = Start-Process -FilePath $innoSetup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup bootstrap failed ($($process.ExitCode))." }
          $innoCompiler = Join-Path $innoDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $innoCompiler -PathType Leaf)) { throw 'Pinned Inno compiler is missing.' }
          "inno_compiler=$innoCompiler" >> $env:GITHUB_OUTPUT
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2 WixToolset.Util.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Prepare Windows portable ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $out = "${{ needs.metadata.outputs.artifact_dir }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$out/Slovofon-v$version-windows-x64-portable.zip" `
            -Force

      - name: Build Windows installers
        shell: pwsh
        run: |
          ./tools/windows/Build-WindowsInstallers.ps1 `
            -BundleDir build/windows/x64/runner/Release `
            -OutputDir "${{ needs.metadata.outputs.artifact_dir }}" `
            -Format All -Culture ru-RU `
            -InnoCompiler "${{ steps.packaging.outputs.inno_compiler }}"

      - name: Sign Windows installers
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe not found' }
          $files = Get-ChildItem "${{ needs.metadata.outputs.artifact_dir }}" -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          foreach ($file in $files) {
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "${{ steps.signing.outputs.pfx_path }}" /p "$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD" $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            ${{ needs.metadata.outputs.artifact_dir }}/Slovofon-v*-windows-x64-setup.exe
            ${{ needs.metadata.outputs.artifact_dir }}/Slovofon-v*-windows-x64-msi.msi
            ${{ needs.metadata.outputs.artifact_dir }}/Slovofon-v*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Clean Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'slovofon-code-signing.pfx') -Force -ErrorAction SilentlyContinue

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - android-release
      - windows-release
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded-artifacts

      - name: Prepare SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          out="${{ needs.metadata.outputs.artifact_dir }}"
          mkdir -p "$out"
          find downloaded-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "$out/$(basename "$file")"
          done
          (
            cd "$out"
            sha256sum * | sort -k2 > SHA256SUMS.txt
          )
          ls -lh "$out"

      - name: Ensure release tag exists
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          . ./tools/release/ReleaseGuard.ps1
          $commit = git rev-parse "$($env:GITHUB_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Build commit could not be resolved.' }
          if (-not (Assert-RemoteReleaseTag -Tag $env:RELEASE_TAG -ExpectedCommit $commit)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $env:RELEASE_TAG -m "Slovofon $env:RELEASE_TAG" $commit
            if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed.' }
            git push origin "refs/tags/$($env:RELEASE_TAG)"
            if ($LASTEXITCODE -ne 0) { throw 'Release tag push failed.' }
          }
          # Re-read origin immediately before publication to catch a raced/moved tag.
          Assert-RemoteReleaseTag -Tag $env:RELEASE_TAG -ExpectedCommit $commit -RequireTag | Out-Null

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          out="${{ needs.metadata.outputs.artifact_dir }}"
          prerelease_flag=()
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Published artifacts are immutable; prepare a new version."
            exit 1
          fi
          notes_file="RELEASE_NOTES.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="CHANGELOG.md"
          fi
          # create also fails closed if another publisher created this release.
          gh release create "$tag" "$out"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Slovofon $tag" \
            --notes-file "$notes_file" \
            --verify-tag \
            "${prerelease_flag[@]}"
