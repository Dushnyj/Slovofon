name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag. Empty means v<VERSION>."
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.0"
  JAVA_VERSION: "17"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      artifact_dir: ${{ steps.metadata.outputs.artifact_dir }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="${{ inputs.release_tag }}"
          if [[ -z "$tag" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="v${version}"
            fi
          fi
          if [[ "$tag" != v* ]]; then
            echo "::error::Release tag must start with v: $tag"
            exit 1
          fi
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::VERSION is $version but release tag is $tag"
            exit 1
          fi
          pubspec_version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          if [[ "$pubspec_version" != "${version}"+* ]]; then
            echo "::error::pubspec.yaml version ($pubspec_version) does not match VERSION ($version)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "artifact_dir=artifacts/$tag"
            echo "prerelease=${{ inputs.prerelease || false }}"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Flutter checks
    runs-on: ubuntu-24.04
    needs: metadata
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release:
    name: Android signed release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - checks
    timeout-minutes: 45
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Android signing files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/slovofon-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          cat > android/key.properties <<EOF
          storeFile=$keystore_path
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android universal APK
        run: flutter build apk --release

      - name: Build Android ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android AAB
        run: flutter build appbundle --release

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Prepare Android release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          out="${{ needs.metadata.outputs.artifact_dir }}"
          mkdir -p "$out"
          cp build/app/outputs/flutter-apk/app-release.apk "$out/Slovofon-v${version}-android-universal-release.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$out/Slovofon-v${version}-android-arm64-v8a-release.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$out/Slovofon-v${version}-android-armeabi-v7a-release.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$out/Slovofon-v${version}-android-x86_64-release.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$out/Slovofon-v${version}-android-release.aab"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: ${{ needs.metadata.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Clean Android signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/slovofon-upload.jks"

  windows-release:
    name: Windows release packages
    runs-on: windows-2022
    needs:
      - metadata
      - checks
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Prepare signing certificate
        id: signing
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'slovofon-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            "enabled=true" >> $env:GITHUB_OUTPUT
            "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning 'Windows signing secrets are not configured. Windows artifacts will be unsigned.'
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Sign Windows app executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe not found' }
          $exe = "build\windows\x64\runner\Release\Slovofon.exe"
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "${{ steps.signing.outputs.pfx_path }}" /p "$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Prepare Windows portable ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $out = "${{ needs.metadata.outputs.artifact_dir }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$out/Slovofon-v$version-windows-x64-portable.zip" `
            -Force

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $sourceDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $outputDir = (Resolve-Path "${{ needs.metadata.outputs.artifact_dir }}").Path
          $iconPath = (Resolve-Path "windows/runner/resources/app_icon.ico").Path
          $env:SLOVOFON_APP_VERSION = $version
          $env:SLOVOFON_SOURCE_DIR = $sourceDir
          $env:SLOVOFON_OUTPUT_DIR = $outputDir
          $env:SLOVOFON_OUTPUT_BASE = "Slovofon-v$version-windows-x64-setup"
          $env:SLOVOFON_ICON_PATH = $iconPath
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer/windows/inno/Slovofon.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $sourceDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $outputDir = (Resolve-Path "${{ needs.metadata.outputs.artifact_dir }}").Path
          $iconPath = (Resolve-Path "windows/runner/resources/app_icon.ico").Path
          $wxs = Join-Path $env:RUNNER_TEMP 'Slovofon.wxs'
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/windows/New-WixInstallerSource.ps1 `
            -SourceDir $sourceDir `
            -OutputPath $wxs `
            -ProductVersion $version `
            -IconPath $iconPath
          wix build $wxs -arch x64 -out "$outputDir/Slovofon-v$version-windows-x64-msi.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Windows installers
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe not found' }
          $files = Get-ChildItem "${{ needs.metadata.outputs.artifact_dir }}" -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          foreach ($file in $files) {
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "${{ steps.signing.outputs.pfx_path }}" /p "$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD" $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: ${{ needs.metadata.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Clean Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'slovofon-code-signing.pfx') -Force -ErrorAction SilentlyContinue

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - android-release
      - windows-release
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded-artifacts

      - name: Prepare SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          out="${{ needs.metadata.outputs.artifact_dir }}"
          mkdir -p "$out"
          find downloaded-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "$out/$(basename "$file")"
          done
          (
            cd "$out"
            sha256sum * | sort -k2 > SHA256SUMS.txt
          )
          ls -lh "$out"

      - name: Ensure release tag exists
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Slovofon $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          out="${{ needs.metadata.outputs.artifact_dir }}"
          prerelease_flag=()
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$out"/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            notes_file="RELEASE_NOTES.md"
            if [[ ! -f "$notes_file" ]]; then
              notes_file="CHANGELOG.md"
            fi
            gh release create "$tag" "$out"/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Slovofon $tag" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${prerelease_flag[@]}"
          fi
