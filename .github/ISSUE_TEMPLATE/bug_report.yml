name: Ошибка
description: Проблема интерфейса, поиска, плеера, загрузок или обновления.
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за воспроизводимый отчёт. Эта форма публикуется открыто.
        Не прикладывайте токены, cookies, headers, полные media URL, пользовательскую БД или скачанные книги.
        [Поддержка](https://github.com/Dushnyj/Slovofon/blob/main/SUPPORT.md) · [Безопасность](https://github.com/Dushnyj/Slovofon/blob/main/docs/SECURITY.md)
  - type: checkboxes
    id: preparation
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил существующие issues и не нашёл сообщения с такими же условиями.
          required: true
        - label: В сообщении и вложениях нет секретов или персональных данных.
          required: true
  - type: input
    id: version
    attributes:
      label: Версия и сборка Slovofon
      description: Из «О приложении». Для собственной сборки добавьте commit и Debug/Release.
      placeholder: Публичная версия, номер сборки, откуда установлен файл
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      multiple: true
      options:
        - Android — телефон или планшет
        - Android TV
        - Windows
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Устройство и окружение
      description: Модель устройства и версия ОС. Для TV — пульт; для Windows — размер окна и масштаб дисплея. Не указывайте серийный номер или личные пути.
      placeholder: Модель / ОС / разрешение / способ управления
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Раздел приложения
      multiple: true
      options:
        - Главная
        - Поиск и источники
        - Карточка книги
        - Библиотека
        - Плеер и фоновое воспроизведение
        - Загрузки и offline
        - Настройки и внешний вид
        - Установка или обновление
        - Другое
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      description: Укажите начальное состояние и последовательность действий. Для редкой ошибки — частоту и условия.
      placeholder: |
        1. Открыть…
        2. Нажать…
        3. Получить…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Видимый текст/код ошибки, зависание, потеря фокуса, неправильный звук или другое наблюдение.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Источник, книга и режим воспроизведения
      description: Если применимо — источник, название, чтец, глава, онлайн/offline, одна книга или несколько. Не вставляйте полные media URL и подписанные ссылки.
  - type: textarea
    id: appearance
    attributes:
      label: Тема, масштабы и положение экрана
      description: Для UI — светлая/тёмная тема, размер текста в приложении и системный масштаб отдельно. Добавьте ориентацию телефона или состояние фокуса TV.
      placeholder: "Тема: …; текст приложения: …%; системный текст/масштаб: …; окно/ориентация: …"
  - type: textarea
    id: evidence
    attributes:
      label: Скриншоты и дополнительная диагностика
      description: Необязательные обезличенные изображения или короткая запись. Не отправляйте полные логи/сетевые дампы, БД и аудиофайлы. Для звука опишите, слышен ли он, а не только движение прогресса.
